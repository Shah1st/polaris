# Build the polaris dev image and test the workspace (branch Romain) in Cloud Build,
# where the network is fast. Nothing stays running afterwards.
#
#   gcloud builds submit scripts/gcp --config scripts/gcp/cloudbuild_polaris.yaml
#
# The submitted folder (this file, fake_mapper.py, ros_smoke_test.sh) lands in
# /workspace; polaris is cloned next to it.
substitutions:
  _BRANCH: Romain
steps:
  - id: clone
    name: gcr.io/cloud-builders/git
    args: ['clone', '--depth', '1', '-b', '${_BRANCH}', 'https://github.com/Shah1st/polaris.git', 'polaris']
  - id: image
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', 'polaris-dev', 'polaris']
  - id: build-and-test
    name: gcr.io/cloud-builders/docker
    args: ['run', '--rm', '--user', 'root', '-v', '/workspace/polaris:/ws', '-v', '/workspace:/smoke',
           'polaris-dev', 'bash', '/smoke/ros_smoke_test.sh']
options:
  machineType: E2_HIGHCPU_8
timeout: 2400s
