<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polaris — simulation MuJoCo</title>
<style>
  html, body { margin:0; background:#111417; color:#e6e9ee;
               font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; padding:8px 16px; border-bottom:1px solid #2a3038; }
  h1 { font-size:15px; margin:0; flex:1; min-width:220px; }
  select { background:#20262d; color:#e6e9ee; border:1px solid #2a3038; border-radius:6px; padding:3px 6px; max-width:100%; }
  main { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:10px; padding:10px; box-sizing:border-box; }
  figure { margin:0; min-width:0; display:flex; flex-direction:column; background:#191d22; border-radius:8px; overflow:hidden; }
  figcaption { padding:5px 10px; color:#8b95a3; display:flex; flex-wrap:wrap; gap:4px 8px; justify-content:space-between; align-items:center; font-variant-numeric:tabular-nums; }
  figcaption b { color:#e6e9ee; font-weight:600; }
  canvas { display:block; width:100%; height:31vh; min-height:180px; object-fit:contain; background:#000; }
  .map canvas { background:#e1e0d9; }
  .legend { padding:4px 10px 7px; color:#aab3bf; font-size:12px; line-height:1.6; }
  .sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin:0 3px 0 8px; vertical-align:-1px; border:1px solid #0006; }
  .num { padding:4px 10px 7px; color:#c9d1db; font-size:12px; font-variant-numeric:tabular-nums; }
  .old { color:#e0a43a; } .dead { color:#ef6b6b; }
  #status { grid-column:1 / -1; background:#191d22; border-radius:8px; padding:8px 12px; color:#c9d1db; font-size:13px; }
  #status .act { font-weight:600; color:#fff; }
  .note { color:#8b95a3; font-size:12px; }
  @media (max-width: 900px) { main { grid-template-columns:1fr; } canvas { height:auto; } }
</style>
</head>
<body>
<header>
  <h1>Simulation MuJoCo — forêt (rover + drone) et fusion des cartes</h1>
  <label>Image <select id="preset">
    <option value="ld">légère</option><option value="sd" selected>normale</option><option value="hd">pleine</option>
  </select></label>
  <label>Points du rover <select id="source">
    <option value="camera">caméra du rover (profondeur du simulateur, portée bornée)</option>
    <option value="d405">D405 (courte portée)</option>
    <option value="da3" disabled>estimation DA3 du mappeur (à venir)</option>
  </select></label>
  <span id="srcMsg" class="note"></span>
</header>
<main>
  <figure><figcaption><b>Caméra du rover</b><span id="fRover">–</span></figcaption><canvas id="rover"></canvas></figure>
  <figure><figcaption><b>Vue du drone</b><span id="fDrone">–</span></figcaption><canvas id="drone"></canvas></figure>
  <figure>
    <figcaption><b>Profondeur</b>
      <select id="depthMode">
        <option value="d405">D405 simulée vs profondeur exacte</option>
        <option value="camera">caméra du rover : profondeur exacte</option>
      </select>
      <span id="aDepth">–</span></figcaption>
    <canvas id="depth"></canvas>
    <div class="num" id="depthNum">–</div>
  </figure>

  <figure class="map">
    <figcaption><b>1. Projection des points du rover</b><span id="aRoverMap">–</span></figcaption>
    <canvas id="roverMap"></canvas>
    <div class="legend">Vue de dessus, nord en haut, 8 × 8 m autour du rover (cadre bleu sur les autres cartes).
      <br><span class="sw" style="background:#8fd4b4"></span>libre (ce scan)<span class="sw" style="background:#eb6834"></span>obstacle (ce scan)<span class="sw" style="background:#b0177a"></span>vide / falaise (sol attendu absent)<span class="sw" style="background:#dbe6dd"></span><span class="sw" style="background:#e5aa8f"></span>libre / obstacle vus avant
      <br>Points : <span class="sw" style="background:#6e8c78"></span>sol<span class="sw" style="background:#dc2828"></span>5–30 cm (obstacle)<span class="sw" style="background:#3caa3c"></span>5–30 cm et vert (végétation basse, franchie)<span class="sw" style="background:#2878c8"></span>plus haut (branches, ignorées) · cercle : portée</div>
  </figure>
  <figure class="map">
    <figcaption><b>2. Grille du drone</b><span id="aDroneMap">–</span></figcaption>
    <canvas id="droneMap"></canvas>
    <div class="legend">Ce que le drone voit depuis 18 m (grille du simulateur), envoyé à la fusion en tuiles de 5 cm.
      <br><span class="sw" style="background:#fcfcfb"></span>libre<span class="sw" style="background:#52514e"></span>obstacle / pente / eau<span class="sw" style="background:#e1e0d9"></span>non vu (sous les arbres)<span class="sw" style="background:#e34948"></span>objectif · flèche noire : rover · ○ départ</div>
  </figure>
  <figure class="map">
    <figcaption><b>3. Carte fusionnée (code de Paco)</b><span id="aFused">–</span></figcaption>
    <canvas id="fused"></canvas>
    <div class="legend">merging_map : CarteFusion.recevoir + decider (A*) vers l'objectif. Le rover vu l'emporte sur le drone.
      <br><span class="sw" style="background:#fcfcfb"></span>libre (drone)<span class="sw" style="background:#d3eee2"></span>libre (rover)<span class="sw" style="background:#52514e"></span>obstacle (drone)<span class="sw" style="background:#eb6834"></span>obstacle (rover)<span class="sw" style="background:#e1e0d9"></span>inconnu<span class="sw" style="background:#2a78d6"></span>chemin prévu<span class="sw" style="background:#5a5a5a"></span>trace du rover<span class="sw" style="background:#6250d6"></span>tuiles à vérifier / zoom drone</div>
  </figure>

  <div id="status">Fusion : en attente…</div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise(ok => setTimeout(ok, ms));
const viewer = Math.random().toString(36).slice(2);
// One picture per request, a few requests open: a slow link lowers the frame rate, never the freshness.
function view(name, label) {
  const cv = $(name), ctx = cv.getContext('2d');
  let shownSeq = 0, shown = 0, boot = '';
  async function loop() {
    for (;;) {
      try {
        const r = await fetch(`/frame.jpg?s=${name}&c=${viewer}${name}&p=${$('preset').value}`, { cache: 'no-store' });
        if (r.status !== 200) { await sleep(300); continue; }
        const seq = +r.headers.get('X-Seq');
        // The server restarted: its frame numbers start again from 1.
        const b = r.headers.get('X-Boot') || '';
        if (b !== boot) { boot = b; shownSeq = 0; }
        const bmp = await createImageBitmap(await r.blob());
        if (seq > shownSeq) {
          shownSeq = seq; shown++;
          if (cv.width !== bmp.width || cv.height !== bmp.height) { cv.width = bmp.width; cv.height = bmp.height; }
          ctx.drawImage(bmp, 0, 0);
        }
        bmp.close();
      } catch (e) { await sleep(500); }
    }
  }
  for (let i = 0; i < 2; i++) loop();
  setInterval(() => { $(label).textContent = shown + ' img/s'; shown = 0; }, 1000);
}
view('rover', 'fRover'); view('drone', 'fDrone');

// Live map fusion (sim/fusion_live.py, relayed under /fusion/): ONE request at a time, about
// once per second for the whole set; the drone grid only changes with the rover marker, so it
// is fetched every few rounds.
const panels = [
  { canvas: 'roverMap', age: 'aRoverMap', file: () => 'rover.png', every: 1 },
  { canvas: 'fused', age: 'aFused', file: () => 'fused.png', every: 1 },
  { canvas: 'depth', age: 'aDepth', file: () => 'depth_' + $('depthMode').value + '.png', every: 1 },
  { canvas: 'droneMap', age: 'aDroneMap', file: () => 'drone.png', every: 4 },
];
for (const p of panels) { p.got = 0; p.ageMs = 0; p.lastFile = ''; }
let status = null, chosenAt = 0;

async function fetchPanel(p) {
  const file = p.file();
  const r = await fetch('/fusion/' + file, { cache: 'no-store' });
  if (r.status !== 200) throw new Error('HTTP ' + r.status);
  const bmp = await createImageBitmap(await r.blob());
  const cv = $(p.canvas);
  if (cv.width !== bmp.width || cv.height !== bmp.height) { cv.width = bmp.width; cv.height = bmp.height; }
  cv.getContext('2d').drawImage(bmp, 0, 0);
  bmp.close();
  p.got = performance.now(); p.ageMs = +(r.headers.get('X-Age-Ms') || 0); p.lastFile = file;
}

function fmt(v, d) { return (v === null || v === undefined || isNaN(v)) ? '–' : (+v).toFixed(d); }
const ACTIONS = {
  SUIVRE: 'SUIVRE — chemin trouvé',
  DEMANDER_DRONE: 'DEMANDER_DRONE — zoom du drone demandé',
  OBJECTIF_DEGRADE: 'OBJECTIF_DEGRADE — aucun passage : point accessible le plus proche',
  INSPECTER: 'INSPECTER — le rover va voir lui-même',
};

function showStatus(s) {
  const el = $('status');
  if (!s) { el.textContent = 'Fusion : pas de réponse (processus arrêté ?)'; return; }
  const d = s.decision || {}, sc = s.scan || {}, dr = s.drone || {}, du = s.durees || {};
  const goal = s.objectif || [];
  let html = '';
  if (s.etat === 'erreur') html += `<span class="dead">Erreur de la boucle : ${s.erreur}</span><br>`;
  html += `<span class="act">Décision n° ${d.numero || 0} : ${ACTIONS[d.action] || d.action || '–'}</span>`
    + ` · chemin ${fmt(d.longueur_chemin_m, 1)} m vers l'objectif (${fmt(goal[0], 1)}, ${fmt(goal[1], 1)})`
    + ` · recalculée parce que : ${d.pourquoi || '–'} (il y a ${fmt(d.age_s, 0)} s)`;
  if (d.distance_restante_m !== null && d.distance_restante_m !== undefined) html += ` · reste ${fmt(d.distance_restante_m, 1)} m jusqu'à l'objectif`;
  if (d.tuiles && d.tuiles.length) html += ` · tuiles demandées au drone : ${JSON.stringify(d.tuiles)}`;
  if (d.a_verifier && d.a_verifier.length) html += ` · à vérifier : ${JSON.stringify(d.a_verifier)}`;
  const rv = s.rover || {};
  html += `<br>Rover (${fmt(rv.x, 1)}, ${fmt(rv.y, 1)}) m, t simu ${fmt(s.t_sim, 0)} s`
    + ` · scan : ${sc.points || 0} points, ${sc.free || 0} cases libres, ${sc.obstacle || 0} obstacles, ${sc.drop || 0} vides, ${sc.tuiles_envoyees || 0} tuiles envoyées`
    + ` · tuiles en mémoire : drone ${dr.tuiles || 0} (niveau z${dr.niveau_z}), rover ${s.tuiles_rover || 0}`
    + ` · boucle ${fmt(du.total_s, 2)} s (décision ${fmt(du.decision_s, 2)} s)`;
  html += `<br><span class="note">Points du rover : ${s.source_rover || '–'}. Ce n'est pas l'estimation DA3 du mappeur.`
    + ` Le rover simulé suit sa propre route : le chemin bleu est ce que la fusion ferait depuis sa position, rien ne lui est envoyé.</span>`;
  el.innerHTML = html;
  if (performance.now() - chosenAt > 5000 && s.source_active) $('source').value = s.source_active;
  if (s.sources) for (const src of s.sources) {
    const o = $('source').querySelector(`option[value="${src.id}"]`);
    if (o) o.disabled = !src.disponible;
  }
  const p = s.profondeur || {};
  if ($('depthMode').value === 'd405') {
    $('depthNum').textContent = `D405 (modèle de capteur) : ${fmt(p.mesures_pct, 1)} % des pixels mesurés,`
      + ` ${fmt(p.mesures_dans_portee_pct, 1)} % de ceux dont la vraie profondeur est dans sa portée ${p.d405_portee_m ? p.d405_portee_m.join('–') : '–'} m`
      + ` · erreur médiane ${fmt(p.erreur_mediane_m * 1000, 1)} mm (${fmt(p.erreur_mediane_rel_pct, 2)} %) sur ${p.pixels_communs || 0} pixels communs`
      + ` · à droite : profondeur exacte du simulateur, même vue · noir = pas de mesure, gris = au-delà de 1 m`;
  } else {
    $('depthNum').textContent = `Caméra du rover, profondeur exacte du simulateur (vérité, pas un capteur), échelle 0–${p.camera_rover_echelle_m || 8} m,`
      + ` gris = plus loin ou ciel · ${fmt(p.camera_rover_dans_portee_pct, 1)} % des pixels à moins de ${fmt(s.portee_m, 1)} m (portée utilisée pour la carte)`;
  }
}

async function fusionLoop() {
  let round = 0;
  for (;;) {
    const t0 = performance.now();
    try {
      const r = await fetch('/fusion/status.json', { cache: 'no-store' });
      status = r.status === 200 ? await r.json() : null;
      showStatus(status);
      for (const p of panels) {
        if (round % p.every !== 0 && p.got && p.lastFile === p.file()) continue;
        await fetchPanel(p);
      }
    } catch (e) {
      showStatus(null);
      await sleep(1500);
    }
    round++;
    const wait = 1000 - (performance.now() - t0);
    if (wait > 0) await sleep(wait);
  }
}
fusionLoop();

// Age of what is shown: age when the server sent it + time since it arrived.
setInterval(() => {
  const now = performance.now();
  for (const p of panels) {
    const el = $(p.age);
    if (!p.got) { el.textContent = '–'; continue; }
    const age = (p.ageMs + (now - p.got)) / 1000;
    el.textContent = 'il y a ' + age.toFixed(1) + ' s';
    el.className = age > 10 ? 'dead' : (age > 4 ? 'old' : '');
  }
}, 500);

$('depthMode').addEventListener('change', () => { showStatus(status); });
$('source').addEventListener('change', async () => {
  chosenAt = performance.now();
  const value = $('source').value;
  $('srcMsg').textContent = 'changement de source…';
  try {
    const r = await fetch('/fusion/source', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                              body: JSON.stringify({ source: value }) });
    const j = await r.json();
    $('srcMsg').textContent = r.status === 200
      ? 'source changée : la couche rover de la carte fusionnée repart de zéro'
      : ('refusé : ' + (j.error || r.status));
  } catch (e) { $('srcMsg').textContent = 'échec : ' + e; }
});
</script>
</body>
</html>
